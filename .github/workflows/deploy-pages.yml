name: Deploy X-Ray Mirror to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Extract application
        run: |
          mkdir -p _site
          unzip -q xray_mirror_https_pages.zip -d _site
          test -s _site/index.html
          cp medical-review.html _site/medical-review.html
          cp dicom-review.html _site/dicom-review.html
          cp full-body-lab.html _site/full-body-lab.html
          cp ct-series.html _site/ct-series.html
          cp anatomy-3d.html _site/anatomy-3d.html
          cp ct-3d.html _site/ct-3d.html
          python3 - <<'PY'
          from pathlib import Path
          p = Path('_site/index.html')
          html = p.read_text(encoding='utf-8')
          link = '<a href="./medical-review.html" style="display:inline-block;background:#80d3ff;color:#06121c;padding:10px 14px;border-radius:9px;font-weight:700;text-decoration:none;margin:8px 0">Open Medical X-Ray Review</a>'
          link += '<a href="./full-body-lab.html" style="display:inline-block;background:#82d3ff;color:#06121c;padding:10px 14px;border-radius:9px;font-weight:700;text-decoration:none;margin:8px">Full-Body Tracking Lab</a>'
          link += '<a href="./dicom-review.html" style="display:inline-block;background:#82d3ff;color:#06121c;padding:10px 14px;border-radius:9px;font-weight:700;text-decoration:none;margin:8px">DICOM Viewer</a>'
          link += '<a href="./ct-series.html" style="display:inline-block;background:#82d3ff;color:#06121c;padding:10px 14px;border-radius:9px;font-weight:700;text-decoration:none;margin:8px">CT Series Viewer</a>'
          link += '<a href="./anatomy-3d.html" style="display:inline-block;background:#82d3ff;color:#06121c;padding:10px 14px;border-radius:9px;font-weight:700;text-decoration:none;margin:8px">3D Anatomy Model Viewer</a>'
          link += '<a href="./ct-3d.html" style="display:inline-block;background:#82d3ff;color:#06121c;padding:10px 14px;border-radius:9px;font-weight:700;text-decoration:none;margin:8px">CT-Derived 3D Surface</a>'
          if 'ct-3d.html' not in html:
              html = html.replace('<body>', '<body>'+link, 1)
          p.write_text(html,encoding='utf-8')
          PY
          touch _site/.nojekyll
      - name: Validate HTML and JavaScript before deployment
        run: python3 scripts/check-deployment.py
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
